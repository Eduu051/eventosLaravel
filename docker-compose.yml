services:
  esdeveniments_php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: edualdo
        uid: 1002
    container_name: edeventiments_edu
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - general_network

  esdeveniments_db:
    image: mariadb:10.4
    container_name: esdeveniments_db_edualdo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: esdeveniments
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: edualdo
      MYSQL_PASSWORD: edualdo
    volumes:
      - ./docker/mysql:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - general_network

  esdeveniments_nginx:
    image: nginx:stable-alpine
    container_name: esdeveniments_nginx_edualdo
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - esdeveniments_php
    environment:
      VIRTUAL_HOST: esdeveniments.edu.com
    networks:
      - general_network

networks:
  general_network:
    external: true